services:
  satellitum_db:
    image: postgres:16-alpine
    container_name: satellitum_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-administrador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-satellitum}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - satellitum_network

  satellitum_core:
    build: .
    container_name: satellitum_core
    restart: always
    ports:
      - "${APP_PORT:-8502}:8501"
    volumes:
      - .:/app
      - ./.streamlit/credentials:/root/.config/earthengine/credentials
      - ${DATASETS_DIR:-/storage/datasets}:/data/datasets
    environment:
      - DB_HOST=${DB_HOST:-satellitum_db}
      - DB_NAME=${POSTGRES_DB:-satellitum}
      - DB_USER=${POSTGRES_USER:-administrador}
      - DB_PASS=${POSTGRES_PASSWORD}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-ppgrhs-satellitum}
      - EARTHENGINE_PROJECT=${EARTHENGINE_PROJECT:-ppgrhs-satellitum}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:8502}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin123}
    depends_on:
      - satellitum_db
    networks:
      - satellitum_network

  satellitum_worker:
    build: .
    container_name: satellitum_worker
    restart: always
    entrypoint: [ "python3", "-m", "modules.worker" ]
    volumes:
      - .:/app
      - ./.streamlit/credentials:/root/.config/earthengine/credentials
      - ${DATASETS_DIR:-/storage/datasets}:/data/datasets
    environment:
      - DB_HOST=${DB_HOST:-satellitum_db}
      - DB_NAME=${POSTGRES_DB:-satellitum}
      - DB_USER=${POSTGRES_USER:-administrador}
      - DB_PASS=${POSTGRES_PASSWORD}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-ppgrhs-satellitum}
      - EARTHENGINE_PROJECT=${EARTHENGINE_PROJECT:-ppgrhs-satellitum}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:8502}
    depends_on:
      - satellitum_db
    networks:
      - satellitum_network

  # pgAdmin ativado opcionalmente via profile 'tools' ou executado sob demanda.
  # Quando ativo, responde exclusivamente no loopback local (127.0.0.1) com credenciais do .env
  satellitum_pgadmin:
    image: dpage/pgadmin4
    container_name: satellitum_pgadmin
    restart: always
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@satellitum.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - satellitum_db
    networks:
      - satellitum_network

networks:
  satellitum_network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  pgadmin_data:
    driver: local
